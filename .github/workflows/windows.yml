# 在 Windows 上直接运行（不用 Docker、不用 WSL）的检查：装依赖、类型检查、构建网页、后端测试，
# 再用 Windows 自带的 PostgreSQL 起 api、worker 和 web，跑站点冒烟检查。
# 只用 GitHub 自己的 action，按完整 commit SHA 固定。
name: Windows

on:
  push:
    branches: [codeagent-intel]
    # 只在动了会影响运行的文件时跑（后端测试在 Windows 上要二十多分钟）；只改文档不跑。也可以手动触发。
    paths:
      - "apps/**"
      - "packages/**"
      - "modules/**"
      - "industry/**"
      - "site/**"
      - "scripts/**"
      - "database/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".gitattributes"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # windows-latest 预装了 PostgreSQL（服务默认停用，postgres 用户的密码是 root）。
      DATABASE_URL: postgres://postgres:root@127.0.0.1:5432/agenthot_ci
      SITE_URL: http://127.0.0.1:3000
      API_BASE_URL: http://127.0.0.1:3001
      SESSION_SECRET: ci-session-secret-0123456789abcdef
      IMG_PROXY_SIGN_SECRET: ci-img-secret-0123456789abcdef
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Start PostgreSQL
        run: |
          $svc = Get-Service -Name "postgresql*"
          Set-Service -InputObject $svc -Status running -StartupType automatic
          & "$env:PGBIN\psql" --version
          # pg_dump 等命令行工具（安装包默认不放进 PATH）
          Add-Content -Path $env:GITHUB_PATH -Value $env:PGBIN
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build web
        run: npm run build -w @aihot/web
      - name: Standalone tests
        run: npm run test:standalone
      - name: Backend tests
        # 跳过只在 Linux 上成立的三个文件：备份（打包用 tar）和两项优雅停机（向进程发 SIGTERM，
        # Windows 没有这个信号，进程直接结束，见 docs/windows.md 的 pm2 一节）。其余与 npm test 相同。
        run: |
          $skip = "backup.test.ts", "analyze-shutdown.test.ts", "translate-shutdown.test.ts"
          $files = @(Get-ChildItem tests -Filter *.test.ts) + @(Get-ChildItem modules/*/tests -Filter *.test.ts) |
            Where-Object { $skip -notcontains $_.Name } | ForEach-Object { Resolve-Path -Relative $_.FullName }
          node --test-global-setup=tests/databases.ts --import ./tests/databases.ts --test --test-concurrency=6 --test-timeout=120000 @files

      - name: Start api, worker and web; smoke check
        # 一步里起进程、做检查：Windows runner 会在每一步结束时结束这一步启动的进程。
        env:
          COLLECT_ENABLED: "false"
          MODEL_CALLS_ENABLED: "false"
        run: |
          $logs = $env:RUNNER_TEMP
          Start-Process node -ArgumentList "apps/api/src/main.ts" -RedirectStandardOutput "$logs/api.log" -RedirectStandardError "$logs/api.err" -NoNewWindow
          Start-Process node -ArgumentList "apps/worker/src/main.ts" -RedirectStandardOutput "$logs/worker.log" -RedirectStandardError "$logs/worker.err" -NoNewWindow
          $env:NODE_ENV = "production"
          Start-Process node -ArgumentList "server.ts" -WorkingDirectory "apps/web" -RedirectStandardOutput "$logs/web.log" -RedirectStandardError "$logs/web.err" -NoNewWindow
          Remove-Item Env:NODE_ENV
          $up = $false
          for ($i = 0; $i -lt 90; $i++) {
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3000/api/health | Out-Null; $up = $true; break } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $up) { throw "site did not come up" }
          node scripts/smoke.ts --base http://127.0.0.1:3000
          if ($LASTEXITCODE -ne 0) { throw "smoke check failed" }
          node scripts/mcp-check.ts http://127.0.0.1:3000/api/mcp
          if ($LASTEXITCODE -ne 0) { throw "mcp check failed" }
          # 竞品周汇总页（模块页面）
          Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3000/competitors/weekly | Out-Null
          # worker 跑过 20 秒仍在
          Start-Sleep -Seconds 20
          $worker = Get-CimInstance Win32_Process -Filter "Name = 'node.exe'" | Where-Object { $_.CommandLine -like "*apps/worker/src/main.ts*" }
          if (-not $worker) { throw "worker exited" }
      - name: Server logs
        if: always()
        run: |
          foreach ($f in "api.log", "api.err", "worker.log", "worker.err", "web.log", "web.err") {
            $p = Join-Path $env:RUNNER_TEMP $f
            if (Test-Path $p) { Write-Output "== $f"; Get-Content $p -Tail 40 }
          }
